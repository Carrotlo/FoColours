# FoColours configuration
# Tokens available in messages and GUI text:
# {prefix} {theme} {muted} {white} {good} {bad}
# Runtime placeholders used in selected places:
# {player} {colour} {value} {version} {author} {available} {current_colour} {default_colour}

style:
  tokens:
    theme: "#03fc88"
    muted: "#a7b8b0"
    white: "#ffffff"
    good: "#3ecf8e"
    bad: "#ff5d73"

features:
  # Colours only the chat message content. Keep this enabled if another plugin
  # such as LPC controls the overall chat format.
  chat-hook-enabled: true
  # Register PlaceholderAPI hooks when PlaceholderAPI is installed.
  # %focolours_colour% returns the selected colour code for chat formatters.
  placeholderapi-enabled: true
  # Enables the player colour selection GUI opened by /focolours.
  player-gui-enabled: true
  # Allows /focolours reset and the reset button in the GUI.
  reset-enabled: true
  # Shows locked colours in the player menu as unavailable options.
  show-locked-colours: true
  # Master toggle for the rainbow preset.
  rainbow-enabled: true

compatibility:
  ezcolors:
    # Enables one-time migration from EzColors permissions into FoColours userdata.
    enabled: true
    # Sync EzColors permissions into userdata when a player joins.
    sync-on-join: true
    # Delay the permission sync slightly so permissions plugins have time to attach nodes.
    join-sync-delay-ticks: 20
    # Sync EzColors permissions into userdata during startup and reload.
    sync-on-reload: true
    # If true, grants that came from EzColors permissions are removed again
    # if the permission is missing on a later sync.
    revoke-missing-permission-grants: false
    # If true, ezcolors.showrainbow also unlocks the rainbow preset.
    showrainbow-unlocks-rainbow: true

player-data:
  # New players start with only this colour selected and unlocked.
  default-colour: light_gray
  default-unlocked-colours:
    - light_gray

rainbow:
  # The palette used by the rainbow preset.
  palette:
    - "#ff5d73"
    - "#ffbd2e"
    - "#f7f779"
    - "#3ecf8e"
    - "#4dbdff"
    - "#d37cff"
  # If false, spaces do not advance the palette.
  advance-on-spaces: false

editor:
  # New custom hex colours added through the editor use this item material.
  default-custom-material: NAME_TAG

messages:
  prefix: "{theme}FoColours &8» {muted}"
  no-permission: "{prefix} {bad}You do not have permission {muted}to do that."
  player-only: "{prefix} {bad}Only players {muted}can use this."
  reload-complete: "{prefix} {good}Reloaded {theme}FoColours {muted}from config.yml."
  ezcolors-disabled: "{prefix} {bad}EzColors compatibility is disabled {muted}in config.yml."
  ezcolors-toggle-usage: "{prefix} {muted}Usage: {theme}/focoloursadmin convertezcolors <enable|disable|status>{muted}."
  ezcolors-toggle-enabled: "{prefix} {good}Enabled {theme}EzColors compatibility {muted}and synced {theme}{count} {muted}online players."
  ezcolors-toggle-disabled: "{prefix} {bad}Disabled {theme}EzColors compatibility{muted}."
  ezcolors-toggle-status: "{prefix} {muted}EzColors compatibility: {state}"
  reset-disabled: "{prefix} {bad}Reset is disabled {muted}in the config."
  select-success: "{prefix} {good}Selected {theme}{colour}{muted} for your chat."
  reset-success: "{prefix} {good}Reset your chat colour {muted}to {theme}{default_colour}{muted}."
  already-selected: "{prefix} {bad}You are already using {theme}{colour}{muted}."
  already-default: "{prefix} {bad}You are already using the default colour."
  not-unlocked: "{prefix} {bad}You do not have {theme}{colour}{muted} unlocked."
  already-unlocked: "{prefix} {bad}{player} already has {theme}{colour}{muted} unlocked."
  unknown-colour: "{prefix} {bad}Unknown colour {theme}{colour}{muted}."
  unknown-player: "{prefix} {bad}Could not find player {theme}{player}{muted}."
  admin-give-success: "{prefix} {good}Gave {theme}{colour}{muted} to {theme}{player}{muted}."
  admin-take-success: "{prefix} {good}Took {theme}{colour}{muted} from {theme}{player}{muted}."
  cannot-take-default: "{prefix} {bad}You cannot take the default colour from players."
  custom-colour-added: "{prefix} {good}Added custom colour {theme}{colour} {muted}({value}{muted})."
  custom-colour-removed: "{prefix} {good}Removed custom colour {theme}{colour}{muted}."
  custom-colour-item-updated: "{prefix} {good}Updated {theme}{colour}{muted} to use item {theme}{item}{muted}."
  custom-colour-renamed: "{prefix} {good}Renamed the custom colour to {theme}{colour}{muted}."
  cannot-remove-default-custom: "{prefix} {bad}Change the default colour before removing that custom colour."
  cannot-disable-default: "{prefix} {bad}You cannot disable the current default colour."
  colour-must-be-enabled-first: "{prefix} {bad}Enable that colour before setting it as default."
  default-colour-set: "{prefix} {good}Set the default colour to {theme}{colour}{muted}."
  editor-saved: "{prefix} {good}Saved your editor change."
  version: "{prefix} {theme}FoColours {muted}v{version} {muted}by {theme}{author}{muted}."
  admin-usage-give: "{prefix} {muted}Usage: {theme}/focoloursadmin give <player> <colour>"
  admin-usage-take: "{prefix} {muted}Usage: {theme}/focoloursadmin take <player> <colour>"
  prompt-invalid: "{prefix} {bad}That input was not valid. {muted}Try again or type {theme}cancel{muted}."
  prompt-cancelled: "{prefix} {bad}Editor prompt cancelled."
  player-help:
    - "{prefix} {muted}Use {theme}/focolours {muted}to open the colour menu."
    - "{prefix} {muted}Use {theme}/focolours <colour> {muted}to select directly."
    - "{prefix} {muted}Use {theme}/focolours reset {muted}to return to {theme}{default_colour}{muted}."
    - "{prefix} {muted}Unlocked colours: {theme}{available}"
  admin-help:
    - "{prefix} {muted}Use {theme}/focoloursadmin version {muted}to view plugin info."
    - "{prefix} {muted}Use {theme}/focoloursadmin reload {muted}to reload config.yml."
    - "{prefix} {muted}Use {theme}/focoloursadmin editor {muted}to open the config editor."
    - "{prefix} {muted}Use {theme}/focoloursadmin give <player> <colour> {muted}to unlock a colour."
    - "{prefix} {muted}Use {theme}/focoloursadmin take <player> <colour> {muted}to remove a colour."
    - "{prefix} {muted}Use {theme}/focoloursadmin convertezcolors <enable|disable|status> {muted}to control EzColors permission syncing."
  prompts:
    edit-prefix:
      - "{prefix} {muted}Type the new prefix value in chat."
      - "{prefix} {muted}You can use colour codes and the normal FoColours message tokens."
      - "{prefix} {muted}Type {theme}cancel {muted}to stop."
    edit-player-title:
      - "{prefix} {muted}Type the new player GUI title in chat."
      - "{prefix} {muted}Keep it short enough for a menu title."
      - "{prefix} {muted}Type {theme}cancel {muted}to stop."
    edit-admin-title:
      - "{prefix} {muted}Type the new admin GUI title in chat."
      - "{prefix} {muted}Keep it short enough for a menu title."
      - "{prefix} {muted}Type {theme}cancel {muted}to stop."
    add-custom-colour:
      - "{prefix} {muted}Type: {theme}<key> <#RRGGBB> [Display Name]"
      - "{prefix} {muted}Example: {theme}sunset #ff8844 Sunset"
      - "{prefix} {muted}Type {theme}cancel {muted}to stop."
    rename-custom-colour:
      - "{prefix} {muted}Type the new display name for {theme}{colour}{muted}."
      - "{prefix} {muted}Type {theme}cancel {muted}to stop."

gui:
