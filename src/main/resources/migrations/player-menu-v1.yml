      - 10
      - 11
      - 12
      - 13
      - 14
      - 15
      - 16
      - 19
      - 20
      - 21
      - 22
      - 23
      - 24
      - 25
      - 28
      - 29
      - 30
      - 31
      - 32
      - 33
      - 34
      - 37
      - 38
      - 39
      - 40
      - 41
      - 42
      - 43
    close:
      name: "{bad}Close"
      lore:
        - "{white}Close this menu."
    back:
      name: "{theme}Back"
      lore:
        - "{white}Return to the previous menu."

  states:
    enabled: "{good}Enabled"
    disabled: "{bad}Disabled"
    unlocked: "{good}Unlocked"
    locked: "{bad}Locked"
    yes: "{good}Yes"
    no: "{bad}No"
    custom: "{theme}Custom"
    built-in: "{muted}Built-in"

  player-menu:
    title: "&8FoColours"
    locked-material: BARRIER
    items:
      colour-unlocked:
        name: "{theme}{colour}"
        lore:
          - "{white}Preview: {preview}"
          - "{white}Status: {status}"
          - "{white}Left-click to use this colour."
      colour-locked:
        name: "{bad}{colour}"
        lore:
          - "{white}Preview: {preview}"
          - "{white}Status: {status}"
      reset:
        name: "{theme}Reset Colour"
        lore:
          - "{white}Return to {theme}{default_colour}{white}."
          - "{white}Current: {theme}{current_colour}"
      info:
        name: "{theme}Your Colours"
        lore:
          - "{white}Current: {theme}{current_colour}"
          - "{white}Unlocked colours:"
        unlocked-header: "{white} "
        unlocked-entry: "{white}• {theme}{colour}"
        empty-unlocked: "{white}• {theme}Light Gray"

  admin-menu:
    title: "&8FoColours Editor"
    items:
      chat-hook:
        name: "{theme}Chat Hook"
        lore:
          - "{white}Toggle colouring the player message content."
          - "{white}State: {state}"
      placeholderapi:
        name: "{theme}PlaceholderAPI Hook"
        lore:
          - "{white}Toggle FoColours PlaceholderAPI hooks."
          - "{white}State: {state}"
      reset:
        name: "{theme}Reset Button"
        lore:
          - "{white}Toggle player reset access."
          - "{white}State: {state}"
      show-locked:
        name: "{theme}Show Locked Colours"
        lore:
          - "{white}Toggle locked colours in the player GUI."
          - "{white}State: {state}"
      rainbow:
        name: "{theme}Rainbow Preset"
        lore:
          - "{white}Toggle the rainbow preset."
          - "{white}State: {state}"
      edit-prefix:
        name: "{theme}Edit Prefix"
        lore:
          - "{white}Click to edit the plugin prefix"
          - "{white}through a chat prompt."
      edit-player-title:
        name: "{theme}Edit Player GUI Title"
        lore:
          - "{white}Click to change the player menu title."
      edit-admin-title:
        name: "{theme}Edit Admin GUI Title"
        lore:
          - "{white}Click to change the admin menu title."
      manage-colours:
        name: "{theme}Manage Colours"
        lore:
          - "{white}Toggle colours, set the default,"
          - "{white}or remove custom colours."
      add-custom:
        name: "{theme}Add Custom Hex Colour"
        lore:
          - "{white}Click to add a new custom colour"
          - "{white}with a key and hex value."
      reload:
        name: "{theme}Reload Plugin"
        lore:
          - "{white}Reload config.yml and refresh runtime data."

  colour-config-menu:
    title: "&8Colour Manager"
    items:
      colour:
        name: "{theme}{colour}"
        lore:
          - "{white}Preview: {preview}"
          - "{white}Type: {custom_state}"
          - "{white}Enabled: {status}"
          - "{white}Default: {default_state}"
          - "{white}Left-click: toggle enabled"
          - "{white}Shift-left: set as default"
          - "{white}Right-click: remove custom colour"
          - "{white}Shift-right: rename custom colour"
          - "{white}Place an item on a custom colour to change its icon"
      info:
        name: "{theme}Colour Controls"
        lore:
          - "{white}Left-click toggles a colour."
          - "{white}Shift-left sets the default."
          - "{white}Right-click removes custom colours."

